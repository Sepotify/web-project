<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Display Property Example</title>
  <style>
    .box {
      padding: 10px;
      margin: 5px;
      background-color: lightblue;
      border: 1px solid steelblue;
      width: 200px;
    }

    .block {
      display: block;
    }

    .inline {
      display: inline;
      width: 800px;
    }

    .inline-block {
      display: inline-block;
      width: 800px;
    }
  </style>
</head>

<body>
  <h2>Display Property Examples</h2>

  <h3>Block Elements</h3>
  <div class="box block">Block 1</div>
  <div class="box block">Block 2</div>

  <h3>Inline Elements</h3>
  <span class="box inline">Inline 1</span>
  <span class="box inline">Inline 2</span>

  <h3>Inline-Block Elements</h3>
  <div class="inline-block box">Inline-Block 1</div>
  <div class="box inline-block">Inline-Block 2</div>
</body>

</html>
