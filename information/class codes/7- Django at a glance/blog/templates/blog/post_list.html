<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f4f9; color: #333; line-height: 1.6; padding: 20px; }
        .container { max-width: 800px; margin: auto; }
        .post-card { background: #fff; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .post-card h2 { margin-top: 0; color: #2c3e50; }
        .meta { color: #7f8c8d; font-size: 0.9em; margin-bottom: 10px; }
        a { text-decoration: none; color: #3498db; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>All Posts</h1>
        {% for post in posts %}
            <div class="post-card">
                <h2><a href="{% url 'post_detail' post.pk %}">{{ post.title }}</a></h2>
                <div class="meta">By {{ post.author }} on {{ post.created_date }}</div>
                <p>{{ post.text|truncatewords:30 }}</p>
                <a href="{% url 'post_detail' post.pk %}">Read more →</a>
            </div>
        {% empty %}
            <p>No posts available yet.</p>
        {% endfor %}
    </div>
</body>
</html>
