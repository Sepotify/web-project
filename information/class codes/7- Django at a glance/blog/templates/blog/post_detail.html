<!-- templates/post_detail.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ post.title }}</title>

  <style>
    :root{
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --accent: #2563eb;
      --accent2:#1d4ed8;
      --shadow: 0 10px 25px rgba(0,0,0,.08);
      --radius: 14px;
    }

    *{ box-sizing: border-box; }
    body{
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, "Noto Sans", "Liberation Sans", sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #dbeafe 0%, transparent 60%),
                  radial-gradient(900px 500px at 100% 0%, #ede9fe 0%, transparent 55%),
                  var(--bg);
      color: var(--text);
      line-height: 1.7;
      padding: 28px 16px;
    }

    .wrap{
      max-width: 860px;
      margin: 0 auto;
    }

    .post{
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .post__header{
      padding: 28px 28px 18px;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(135deg, rgba(37,99,235,.08), rgba(99,102,241,.06));
    }

    .post__title{
      margin: 0 0 10px;
      font-size: clamp(1.6rem, 2.6vw, 2.3rem);
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .post__meta{
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      color: var(--muted);
      font-size: .95rem;
      align-items: center;
    }

    .chip{
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,.06);
      background: rgba(255,255,255,.65);
      backdrop-filter: blur(6px);
    }

    .dot{
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
    }

    .post__body{
      padding: 26px 28px 30px;
      font-size: 1.05rem;
      color: #111827;
    }

    .post__body p{ margin: 0 0 1em; }
    .post__body p:last-child{ margin-bottom: 0; }

    /* Nice styling if you later add headings, lists, etc. */
    .post__body h2, .post__body h3{
      margin: 1.6em 0 .6em;
      line-height: 1.25;
    }
    .post__body ul, .post__body ol{ padding-left: 1.2em; }
    .post__body blockquote{
      margin: 1.2em 0;
      padding: 12px 14px;
      border-left: 4px solid var(--accent);
      background: #f8fafc;
      color: #334155;
      border-radius: 10px;
    }

    .actions{
      display: flex;
      gap: 12px;
      align-items: center;
      margin-top: 16px;
      padding: 0 6px 6px;
    }

    .btn{
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: white;
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      box-shadow: 0 2px 10px rgba(0,0,0,.04);
      transition: transform .08s ease, box-shadow .2s ease, border-color .2s ease;
    }
    .btn:hover{
      border-color: rgba(37,99,235,.35);
      box-shadow: 0 10px 22px rgba(37,99,235,.12);
      transform: translateY(-1px);
    }

    .btn--primary{
      background: linear-gradient(135deg, var(--accent), #4f46e5);
      color: white;
      border-color: transparent;
    }
    .btn--primary:hover{
      box-shadow: 0 12px 26px rgba(37,99,235,.22);
    }
  </style>
</head>

<body>
  <div class="wrap">
    <article class="post">
      <header class="post__header">
        <h1 class="post__title">{{ post.title }}</h1>

        <div class="post__meta">
          <span class="chip"><span class="dot"></span> {{ post.author }}</span>
          <span class="chip">Published: {{ post.created_date }}</span>
        </div>
      </header>

      <div class="post__body">
        {{ post.text|linebreaks }}
      </div>
    </article>

    <div class="actions">
      <a class="btn" href="{% url 'post_list' %}">← Back to posts</a>
    </div>
  </div>
</body>
</html>
